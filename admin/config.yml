backend:
  name: github
  repo: marvi-groundwater/marvi
  branch: main
  base_url: https://sveltia-cms-auth.marvi-groundwater.workers.dev

local_backend: true

media_folder: "assets/marvi-originals"
public_folder: "/assets/marvi-originals"

# ---------------------------------------------------------------------------
# One "Pages" collection. Every page on the site — the original sections and
# anything you create — is a file in content/pages/, editable, deletable and
# reorderable here. "Menu order" controls the sidebar; lower numbers sit
# higher. Sort by → Menu order shows the running order.
#
# A page is a header (title, intro, photos) plus content blocks you can add
# and drag to reorder. Different kinds of content are different BLOCK types,
# each showing only its own fields.
#
# Fields marked widget: hidden carry data the site needs but editors never
# touch — most importantly each block's `i18n` map, which links strings to
# their existing translations in 13 languages. Removing a hidden field from
# this file would make the CMS silently delete that data on save.
# ---------------------------------------------------------------------------

collections:
  - name: "pages"
    label: "Pages"
    label_singular: "page"
    folder: "content/pages"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "menuName"
    slug: "{{fields.slug}}"
    summary: "{{fields.order}} · {{fields.menuName}}"
    sortable_fields:
      - "order"
      - "menuName"
    fields:
      - { label: "Menu name", name: "menuName", widget: "string", hint: "Shown in the site's left-hand menu." }
      - { label: "Page address", name: "slug", widget: "string", pattern: ['^[a-z0-9-]+$', "Lower-case letters, numbers and hyphens only"], hint: "The web address, e.g. groundwater → /groundwater/. Changing it breaks existing links." }
      - { label: "Menu order", name: "order", widget: "number", value_type: "int", min: 1, default: 99, hint: "Lower numbers appear higher in the menu." }
      - { label: "Show on the site", name: "published", widget: "boolean", default: true, required: false }
      - { label: "Template", name: "template", widget: "hidden", default: "standard" }

      - label: "Title & introduction"
        name: "intro"
        widget: "object"
        collapsed: false
        fields: &introFields
          - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
          - { label: "Title", name: "title", widget: "text", hint: "Line break = where the title wraps to a new line." }
          - { label: "Introduction", name: "lede", widget: "text", hint: "One or two sentences. Also the page's Google description and its preview when shared." }
          - { label: "Eyebrow Text Size (%)", name: "eyebrowSize", widget: "number", default: 100, value_type: "int", min: 0, max: 200, step: 5, required: false }
          - { label: "Title Size (%)", name: "titleSize", widget: "number", default: 70, value_type: "int", min: 0, max: 200, step: 5, required: false }
          - { label: "Intro Text Size (%)", name: "ledeSize", widget: "number", default: 100, value_type: "int", min: 0, max: 200, step: 5, required: false }
          - { label: "Text Alignment", name: "textAlign", widget: "select", default: "left", required: false, options: ["left", "center", "right"] }
          - { label: "Text Position", name: "textPosition", widget: "select", default: "bottom", required: false, options: ["top", "middle", "bottom"] }
          - { label: "Text Block Width (%)", name: "textWidth", widget: "number", default: 100, value_type: "int", min: 30, max: 100, step: 5, required: false }
          - { label: "Text Offset X (%)", name: "textOffsetX", widget: "number", default: 0, value_type: "int", min: -30, max: 30, step: 1, required: false }
          - { label: "Text Offset Y (%)", name: "textOffsetY", widget: "number", default: 0, value_type: "int", min: -30, max: 30, step: 1, required: false }

      - label: "Header photo"
        name: "heroImage"
        widget: "object"
        collapsed: true
        required: false
        fields: &photoFields
          - { label: "Photo", name: "image", widget: "image", required: false }
          - { label: "Description for screen readers", name: "alt", widget: "string", required: false }
          - { label: "Zoom (%)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 200, step: 5, required: false }
          - { label: "Focus X (%)", name: "positionX", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
          - { label: "Focus Y (%)", name: "positionY", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
          - { label: "Fit", name: "fit", widget: "select", default: "auto", required: false, options: ["auto", "cover", "contain"] }

      - label: "Menu photo"
        name: "menuImage"
        widget: "object"
        collapsed: true
        required: false
        hint: "Shown on the mobile menu card and when the page is shared. Falls back to the header photo."
        fields: *photoFields

      - label: "Homepage hero (home page only)"
        name: "hero"
        widget: "object"
        collapsed: true
        required: false
        hint: "Only the home page uses this — the big opening screen's small texts and buttons."
        fields:
          - { label: "Corner label", name: "label", widget: "text", required: false }
          - { label: "Bottom-right caption", name: "caption", widget: "text", required: false }
          - { label: "Image area description (screen readers)", name: "stageAlt", widget: "string", required: false }
          - { label: "Photo description (screen readers)", name: "imageAlt", widget: "string", required: false }
          - label: "Buttons"
            name: "actions"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields: &actionFields
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Goes to page (address)", name: "page", widget: "string", hint: "A page address from this site, e.g. approach" }
              - { label: "Filled style", name: "primary", widget: "boolean", default: false, required: false }
          - { label: "i18n", name: "i18n", widget: "hidden", required: false }

      - label: "Content blocks"
        name: "blocks"
        widget: "list"
        label_singular: "block"
        required: false
        typeKey: "type"
        summary: "{{fields.type}}"
        hint: "The page's content, top to bottom. Add blocks and drag to rearrange."
        types:
          # ------------------------------------------------ generic blocks --
          - label: "Text"
            name: "text"
            widget: "object"
            fields:
              - { label: "Small label (optional)", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Text", name: "body", widget: "text", hint: "Use a blank line between paragraphs." }
              - { label: "Text alignment", name: "align", widget: "select", default: "left", required: false, options: ["left", "center", "right"] }
          - label: "Image + text"
            name: "imageText"
            widget: "object"
            fields:
              - { label: "Small label (optional)", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Photo", name: "photo", widget: "object", collapsed: false, fields: *photoFields }
              - { label: "Photo side", name: "photoSide", widget: "select", default: "left", required: false, options: ["left", "right"] }
          - label: "Image gallery"
            name: "gallery"
            widget: "object"
            fields:
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Photos", name: "photos", widget: "list", fields: *photoFields }
          - label: "Callout / quote"
            name: "callout"
            widget: "object"
            fields:
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Callout text", name: "body", widget: "text" }
              - { label: "Style", name: "tone", widget: "select", default: "blue", required: false, options: ["blue", "green", "copper"] }
          - label: "Button link"
            name: "button"
            widget: "object"
            fields:
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Button label", name: "label", widget: "string" }
              - { label: "Link URL", name: "url", widget: "string" }
          - label: "Video"
            name: "video"
            widget: "object"
            fields:
              - { label: "Video URL", name: "url", widget: "string", pattern: ['^https?://\S+$', "Must be a full web address starting with https://"], hint: "A YouTube link; the thumbnail is picked up automatically." }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Small label", name: "meta", widget: "string", required: false }
          - label: "Embedded page"
            name: "embed"
            widget: "object"
            fields:
              - { label: "URL to embed", name: "url", widget: "string", pattern: ['^https?://\S+$', "Must be a full web address starting with https://"] }
              - { label: "Title", name: "title", widget: "string", required: false }

          # -------------------------------------------- editorial layouts --
          - label: "Two-column section"
            name: "split"
            widget: "object"
            fields:
              - label: "Left column"
                name: "left"
                widget: "object"
                collapsed: false
                fields: &splitColumn
                  - { label: "Column type", name: "kind", widget: "select", default: "prose", options: [{ label: "Text", value: "prose" }, { label: "Photo", value: "image" }, { label: "Photo with number overlay", value: "dataPanel" }] }
                  - { label: "Opening line (large)", name: "lead", widget: "text", required: false }
                  - { label: "Paragraphs", name: "paragraphs", widget: "list", required: false, field: { label: "Paragraph", name: "paragraph", widget: "text" } }
                  - label: "Numbered points"
                    name: "features"
                    widget: "list"
                    required: false
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Number", name: "number", widget: "string", required: false, hint: "Blank = automatic (01, 02…)" }
                      - { label: "Title", name: "title", widget: "string" }
                      - { label: "Text", name: "text", widget: "text", required: false }
                  - { label: "Buttons", name: "actions", widget: "list", required: false, summary: "{{fields.label}}", fields: *actionFields }
                  - { label: "Small logo above the text", name: "logo", widget: "object", collapsed: true, required: false, fields: [{ label: "Image", name: "image", widget: "image", required: false }, { label: "Description", name: "alt", widget: "string", required: false }] }
                  - { label: "Photo", name: "photo", widget: "object", collapsed: true, required: false, fields: *photoFields }
                  - { label: "Overlay number", name: "stat", widget: "string", required: false, hint: "Photo-with-number only." }
                  - { label: "Overlay caption", name: "caption", widget: "string", required: false, hint: "Photo-with-number only." }
                  - { label: "look", name: "look", widget: "hidden", required: false }
              - label: "Right column"
                name: "right"
                widget: "object"
                collapsed: false
                fields: *splitColumn
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Card grid"
            name: "cards"
            widget: "object"
            fields:
              - label: "Cards"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Corner label", name: "number", widget: "string", required: false, hint: "e.g. A / 01. Blank = automatic." }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text", required: false }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Photo pair"
            name: "imagePair"
            widget: "object"
            fields:
              - { label: "Style", name: "look", widget: "select", default: "editorial", required: false, options: [{ label: "Editorial (with captions)", value: "editorial" }, { label: "App screens", value: "screens" }] }
              - label: "Photos"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "object", collapsed: false, fields: *photoFields }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Photo ribbon (3 across)"
            name: "photoRibbon"
            widget: "object"
            fields:
              - label: "Photos"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "object", collapsed: false, fields: *photoFields }
          - label: "Dark banner"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "lede", widget: "text", required: false }
              - { label: "Label colour", name: "accent", widget: "string", required: false, hint: "Optional CSS colour, e.g. #88b3b8" }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Statement with numbers"
            name: "statement"
            widget: "object"
            fields:
              - { label: "Small label", name: "label", widget: "string", required: false }
              - { label: "Statement", name: "quote", widget: "text" }
              - label: "Numbers"
                name: "metrics"
                widget: "list"
                summary: "{{fields.value}} — {{fields.label}}"
                fields:
                  - { label: "Number", name: "value", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Story cards (with heading)"
            name: "storyCards"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "lede", widget: "text", required: false }
              - label: "Cards"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Goes to page (address)", name: "page", widget: "string" }
                  - { label: "Small label", name: "label", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Photo", name: "photo", widget: "object", collapsed: true, fields: *photoFields }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Numbered steps"
            name: "steps"
            widget: "object"
            fields:
              - label: "Steps"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text", required: false }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Framed screenshot"
            name: "framedShot"
            widget: "object"
            fields:
              - { label: "Screenshot", name: "photo", widget: "object", collapsed: false, fields: *photoFields }

          # ------------------------------------------------- list layouts --
          - label: "Media stories (searchable)"
            name: "mediaStories"
            widget: "object"
            fields:
              - label: "Stories"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Source · date", name: "meta", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Link", name: "url", widget: "string" }
          - label: "Film grid"
            name: "filmGrid"
            widget: "object"
            fields:
              - label: "Films"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Small label", name: "meta", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "YouTube link", name: "url", widget: "string" }
          - label: "Photo archive (filters + lightbox)"
            name: "photoArchive"
            widget: "object"
            fields:
              - label: "Images"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Zoom (%)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 200, step: 5, required: false }
                  - { label: "Focus X (%)", name: "positionX", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                  - { label: "Focus Y (%)", name: "positionY", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                  - { label: "Fit", name: "fit", widget: "select", default: "auto", required: false, options: ["auto", "cover", "contain"] }
                  - { label: "Category", name: "category", widget: "string", hint: "Groups the image under a filter button." }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Source (optional)", name: "source", widget: "string", required: false }
          # Publications are ONE list; the headed sections on the page are built
          # from each entry's Kind. Reorder or retitle sections below. A section
          # you set up here stays on the page even while it is empty — its chip
          # reads 0 and it shows its "nothing yet" line — so a kind can be
          # announced before there is anything to put in it. A publication whose
          # Kind matches no section drops into the catch-all rather than vanishing.
          - label: "Publication list (sections + filters)"
            name: "publicationList"
            widget: "object"
            fields:
              - label: "Sections, in page order"
                name: "sections"
                widget: "list"
                required: false
                label_singular: "section"
                summary: "{{fields.title}}"
                hint: "Drag to reorder. A section stays visible while empty, showing its 'nothing yet' line. Leave this list empty to fall back to one section per kind, in the order the publications appear."
                fields:
                  - { label: "Kind", name: "kind", widget: "select", options: &publicationKinds ["Journal article", "Conference paper", "Thesis", "Book", "Brochure", "Report", "Other"], hint: "Collects every publication with this Kind." }
                  - { label: "Heading", name: "title", widget: "string", hint: "Shown above the section and on its filter chip." }
                  - { label: "Note under the heading", name: "note", widget: "text", required: false }
                  - { label: "Line shown while empty", name: "empty", widget: "text", required: false, hint: "Appears only while the section has nothing in it. Leave blank for a generic line." }
              - { label: "\"Show everything\" chip", name: "allLabel", widget: "string", required: false, default: "All" }
              - { label: "Catch-all section heading", name: "otherLabel", widget: "string", required: false, default: "Other outputs", hint: "Where a publication goes when its Kind has no section above." }
              - { label: "Default layout", name: "defaultView", widget: "select", required: false, default: "list", options: [{ label: "List (compact rows)", value: "list" }, { label: "Cards (large tiles)", value: "cards" }], hint: "How the page opens. Readers can switch with the List / Cards buttons." }
              - { label: "Start sections closed", name: "startCollapsed", widget: "boolean", required: false, default: true, hint: "On, the page opens as a list of section headings that readers click to open. Searching opens the sections holding matches either way." }
              - { label: "\"List\" button", name: "listLabel", widget: "string", required: false, default: "List" }
              - { label: "\"Cards\" button", name: "cardsLabel", widget: "string", required: false, default: "Cards" }
              - { label: "Search label", name: "searchLabel", widget: "string", required: false, default: "Search" }
              - { label: "Search placeholder", name: "searchPlaceholder", widget: "string", required: false, hint: "Grey hint text inside the search box. Stays English on translated pages." }
              - { label: "\"Nothing matches\" line", name: "emptyMessage", widget: "string", required: false, default: "No publication matches that", hint: "Shown when a search matches nothing anywhere." }
              - label: "Publications"
                name: "items"
                widget: "list"
                summary: "{{fields.kind}} · {{fields.title}}"
                fields:
                  - { label: "Kind", name: "kind", widget: "select", options: *publicationKinds, hint: "Decides which section this appears under." }
                  - { label: "Small label", name: "meta", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - label: "Editions"
                    name: "editions"
                    widget: "list"
                    summary: "{{fields.label}}"
                    fields:
                      - { label: "Language / label", name: "label", widget: "string" }
                      - { label: "Download link", name: "url", widget: "string" }
          - label: "Tool cards"
            name: "toolList"
            widget: "object"
            fields:
              - label: "Tools"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Small label", name: "meta", widget: "string", required: false }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Screenshot", name: "photo", widget: "object", collapsed: true, required: false, fields: *photoFields }
                  - { label: "Button label", name: "linkLabel", widget: "string", required: false }
                  - { label: "Opens page (address)", name: "target", widget: "string", required: false, hint: "A page on this site, e.g. mywell. Leave empty when using an external link." }
                  - { label: "External link", name: "url", widget: "string", required: false, hint: "Wins over the page address if both are set." }
          - label: "Partner list"
            name: "partnerList"
            widget: "object"
            fields:
              - label: "Partners"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Small label", name: "meta", widget: "string", required: false, hint: "e.g. Australia · Lead partner" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Website", name: "url", widget: "string", required: false }
          - label: "Portrait band"
            name: "portraitBand"
            widget: "object"
            fields:
              - label: "People"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Role", name: "title", widget: "string", required: false }
                  - { label: "Affiliation", name: "affiliation", widget: "string", required: false }
                  - { label: "Profile link", name: "url", widget: "string", required: false }
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Zoom (%)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 200, step: 5, required: false }
                  - { label: "Focus X (%)", name: "positionX", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                  - { label: "Focus Y (%)", name: "positionY", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                  - { label: "Fit", name: "fit", widget: "select", default: "auto", required: false, options: ["auto", "cover", "contain"] }
          - label: "Source note"
            name: "sourceNote"
            widget: "object"
            fields:
              - label: "Parts"
                name: "parts"
                widget: "list"
                hint: "Text pieces and links, joined in order into one small note."
                fields:
                  - { label: "Text", name: "text", widget: "string", required: false }
                  - { label: "Link", name: "link", widget: "object", collapsed: true, required: false, fields: [{ label: "Label", name: "label", widget: "string", required: false }, { label: "URL", name: "url", widget: "string", required: false }, { label: "Downloads a file", name: "download", widget: "boolean", default: false, required: false }, { label: "Opens in a new tab", name: "external", widget: "boolean", default: false, required: false }] }
              - { label: "style", name: "style", widget: "hidden", required: false }
