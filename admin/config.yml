backend:
  name: github
  repo: marvi-groundwater/marvi
  branch: main
  base_url: https://sveltia-cms-auth.marvi-groundwater.workers.dev

local_backend: true

media_folder: "assets/marvi-originals"
public_folder: "/assets/marvi-originals"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "content/pages/home.json"
        label: "01 · Homepage"
        name: "home"
        fields:
          - label: "Title & introduction"
            name: "intro"
            widget: "object"
            collapsed: false
            fields: &introFields
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "text", hint: "Line break = where the title wraps to a new line." }
              - { label: "Introduction", name: "lede", widget: "text" }
              - &eyebrowSizeField
                label: "Eyebrow Text Size (%)"
                name: "eyebrowSize"
                widget: "number"
                default: 100
                value_type: "int"
                min: 0
                max: 200
                step: 5
                hint: "100% is the current design. Use 0% to hide it, or up to 200% for twice the size."
              - &titleSizeField
                label: "Title Size (%)"
                name: "titleSize"
                widget: "number"
                default: 70
                value_type: "int"
                min: 0
                max: 200
                step: 5
                hint: "70% is the default. Use 100% for the original responsive title size."
              - &ledeSizeField
                label: "Intro Text Size (%)"
                name: "ledeSize"
                widget: "number"
                default: 100
                value_type: "int"
                min: 0
                max: 200
                step: 5
                hint: "100% is the current responsive intro size."
              - &textAlignField
                label: "Text Alignment"
                name: "textAlign"
                widget: "select"
                default: "left"
                hint: "Moves the whole text block horizontally."
                options: &textAlignOptions
                  - { label: "Left", value: "left" }
                  - { label: "Centre", value: "center" }
                  - { label: "Right", value: "right" }
              - &textPositionField
                label: "Text Position"
                name: "textPosition"
                widget: "select"
                default: "bottom"
                hint: "Moves the whole text block vertically over the image."
                options: &textPositionOptions
                  - { label: "Top", value: "top" }
                  - { label: "Middle", value: "middle" }
                  - { label: "Bottom (recommended)", value: "bottom" }
              - &textWidthField
                label: "Text Block Width (%)"
                name: "textWidth"
                widget: "number"
                default: 100
                value_type: "int"
                min: 30
                max: 100
                step: 5
                hint: "100% uses the normal page width. Reduce this to make the title and introduction wrap sooner."
              - &textOffsetXField
                label: "Text Horizontal Shift (%)"
                name: "textOffsetX"
                widget: "number"
                default: 0
                value_type: "int"
                min: -100
                max: 100
                step: 5
                hint: "0% is the designed position. Negative moves left; positive moves right."
              - &textOffsetYField
                label: "Text Vertical Shift (%)"
                name: "textOffsetY"
                widget: "number"
                default: 0
                value_type: "int"
                min: -100
                max: 100
                step: 5
                hint: "0% is the designed position. Negative moves up; positive moves down."
          - &heroImageField
            label: "Hero image"
            name: "heroImage"
            widget: "object"
            collapsed: false
            fields: &photoFields
              - { label: "Photo", name: "image", widget: "image" }
              - label: "Photo Zoom (%)"
                name: "zoom"
                widget: "number"
                default: 100
                value_type: "int"
                min: 50
                max: 200
                step: 5
                hint: "100% is normal. Increase to crop closer; reduce to show more of the photo."
              - label: "Photo Horizontal Position (%)"
                name: "positionX"
                widget: "number"
                default: 50
                value_type: "int"
                min: 0
                max: 100
                step: 1
                hint: "0% keeps the left side; 50% centres; 100% keeps the right side."
              - label: "Photo Vertical Position (%)"
                name: "positionY"
                widget: "number"
                default: 50
                value_type: "int"
                min: 0
                max: 100
                step: 1
                hint: "0% keeps the top; 50% centres; 100% keeps the bottom."
              - label: "Fit"
                name: "fit"
                widget: "select"
                default: "auto"
                hint: "Fill crops to the slot; Show whole never crops."
                options: &fitOptions
                  - { label: "Auto (recommended)", value: "auto" }
                  - { label: "Fill (crop to slot)", value: "cover" }
                  - { label: "Show whole photo", value: "contain" }
          - &menuImageField
            label: "Menu image"
            name: "menuImage"
            widget: "object"
            collapsed: true
            fields: *photoFields
          - { label: "Primary Button Label", name: "primaryButtonLabel", widget: "string" }
          - { label: "Secondary Button Label", name: "secondaryButtonLabel", widget: "string" }
          - label: "Story-card images"
            name: "images"
            widget: "object"
            collapsed: true
            fields:
              - { label: "The method", name: "storyApproach", widget: "object", collapsed: true, fields: *photoFields }
              - { label: "The people", name: "storyBjs", widget: "object", collapsed: true, fields: *photoFields }
              - { label: "The platform", name: "storyMywell", widget: "object", collapsed: true, fields: *photoFields }
          - &sectionsField
            label: "Add page sections"
            name: "sections"
            widget: "list"
            collapsed: false
            required: false
            summary: "{{fields.heading}}"
            hint: "Add and reorder content below the page's existing sections."
            types:
              - label: "Text section"
                name: "text"
                widget: "object"
                fields:
                  - { label: "Small label (optional)", name: "eyebrow", widget: "string", required: false }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Text", name: "body", widget: "text", hint: "Use a blank line between paragraphs." }
                  - { label: "Text alignment", name: "align", widget: "select", default: "left", options: ["left", "center", "right"] }
              - label: "Image + text section"
                name: "imageText"
                widget: "object"
                fields:
                  - { label: "Small label (optional)", name: "eyebrow", widget: "string", required: false }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Text", name: "body", widget: "text" }
                  - { label: "Photo", name: "photo", widget: "object", collapsed: false, fields: *photoFields }
                  - { label: "Photo side", name: "photoSide", widget: "select", default: "left", options: ["left", "right"] }
              - label: "Image gallery"
                name: "gallery"
                widget: "object"
                fields:
                  - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
                  - { label: "Photos", name: "photos", widget: "list", fields: *photoFields }
              - label: "Callout / quote"
                name: "callout"
                widget: "object"
                fields:
                  - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
                  - { label: "Callout text", name: "body", widget: "text" }
                  - { label: "Style", name: "tone", widget: "select", default: "blue", options: ["blue", "green", "copper"] }
              - label: "Button link"
                name: "button"
                widget: "object"
                fields:
                  - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
                  - { label: "Button label", name: "label", widget: "string" }
                  - { label: "Link URL", name: "url", widget: "string" }

      - file: "content/pages/approach.json"
        label: "02 · The approach"
        name: "approach"
        fields:
          - { label: "Title & introduction", name: "intro", widget: "object", collapsed: false, fields: *introFields }
          - *heroImageField
          - *menuImageField
          - label: "Page images"
            name: "images"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Editorial photo 1", name: "editorial1", widget: "object", collapsed: true, fields: *photoFields }
              - { label: "Editorial photo 2", name: "editorial2", widget: "object", collapsed: true, fields: *photoFields }
              - { label: "Data panel photo", name: "dataPanel", widget: "object", collapsed: true, fields: *photoFields }
          - *sectionsField

      - file: "content/pages/bjs.json"
        label: "03 · Bhujal Jankaars"
        name: "bjs"
        fields:
          - { label: "Title & introduction", name: "intro", widget: "object", collapsed: false, fields: *introFields }
          - *heroImageField
          - *menuImageField
          - *sectionsField

      - file: "content/pages/groundwater.json"
        label: "04 · Groundwater"
        name: "groundwater"
        fields:
          - { label: "Title & introduction", name: "intro", widget: "object", collapsed: false, fields: *introFields }
          - *heroImageField
          - *menuImageField
          - label: "Ribbon images"
            name: "images"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Ribbon photo 1", name: "ribbon1", widget: "object", collapsed: true, fields: *photoFields }
              - { label: "Ribbon photo 2", name: "ribbon2", widget: "object", collapsed: true, fields: *photoFields }
              - { label: "Ribbon photo 3", name: "ribbon3", widget: "object", collapsed: true, fields: *photoFields }
          - *sectionsField

      - file: "content/pages/mywell.json"
        label: "05 · MyWell app"
        name: "mywell"
        fields:
          - { label: "Title & introduction", name: "intro", widget: "object", collapsed: false, fields: *introFields }
          - *heroImageField
          - *menuImageField
          - label: "App screenshots"
            name: "images"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Main screenshot", name: "main", widget: "object", collapsed: true, fields: *photoFields }
              - { label: "Strip screenshot 1", name: "strip1", widget: "object", collapsed: true, fields: *photoFields }
              - { label: "Strip screenshot 2", name: "strip2", widget: "object", collapsed: true, fields: *photoFields }
          - *sectionsField

      - file: "content/pages/media.json"
        label: "06 · In the media"
        name: "media"
        fields:
          - { label: "Title & introduction", name: "intro", widget: "object", collapsed: false, fields: *introFields }
          - *heroImageField
          - *menuImageField
          - label: "Media stories"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Label (source · date)", name: "meta", widget: "string", hint: "e.g. ACIAR · 17 Sep 2024" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link URL", name: "url", widget: "string" }
          - *sectionsField

      - file: "content/pages/films.json"
        label: "07 · Films"
        name: "films"
        fields:
          - { label: "Title & introduction", name: "intro", widget: "object", collapsed: false, fields: *introFields }
          - *heroImageField
          - *menuImageField
          - label: "Videos"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Label (category · source)", name: "meta", widget: "string", hint: "e.g. Documentary · Deutsche Welle" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "YouTube URL", name: "url", widget: "string", hint: "Paste the full YouTube link — the thumbnail is generated automatically." }
          - *sectionsField

      - file: "content/pages/game.json"
        label: "08 · Groundwater game"
        name: "game"
        fields:
          - { label: "Title & introduction", name: "intro", widget: "object", collapsed: false, fields: *introFields }
          - *heroImageField
          - *menuImageField
          - label: "Game image"
            name: "images"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Screenshot", name: "game", widget: "object", collapsed: true, fields: *photoFields }
          - *sectionsField

      - file: "content/pages/people.json"
        label: "09 · People & partners"
        name: "people"
        fields:
          - { label: "Title & introduction", name: "intro", widget: "object", collapsed: false, fields: *introFields }
          - *heroImageField
          - *menuImageField
          - label: "Partners"
            name: "partners"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Label (place · role)", name: "meta", widget: "string", hint: "e.g. Australia · Lead partner" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Partner website URL", name: "url", widget: "string", hint: "The whole partner card is clickable and opens this website." }
          - label: "Portraits"
            name: "portraits"
            widget: "list"
            summary: "{{fields.name}} · {{fields.affiliation}}"
            hint: "Hovering or focusing a portrait reveals these details; clicking opens the profile URL."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Title / role", name: "title", widget: "string" }
              - { label: "Affiliation", name: "affiliation", widget: "string" }
              - { label: "Profile URL", name: "url", widget: "string", hint: "Clicking the portrait opens this profile or organisation page." }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo Zoom (%)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 200, step: 5 }
              - { label: "Photo Horizontal Position (%)", name: "positionX", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1 }
              - { label: "Photo Vertical Position (%)", name: "positionY", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1 }
              - { label: "Fit", name: "fit", widget: "select", default: "auto", options: *fitOptions }
          - *sectionsField

      - file: "content/pages/archive.json"
        label: "10 · Image archive"
        name: "archive"
        fields:
          - { label: "Title & introduction", name: "intro", widget: "object", collapsed: false, fields: *introFields }
          - *heroImageField
          - *menuImageField
          - label: "Archive images"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo Zoom (%)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 200, step: 5 }
              - { label: "Photo Horizontal Position (%)", name: "positionX", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1 }
              - { label: "Photo Vertical Position (%)", name: "positionY", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1 }
              - { label: "Fit", name: "fit", widget: "select", default: "auto", options: *fitOptions }
              - { label: "Category", name: "category", widget: "string", hint: "Groups the image under a filter tab, e.g. Overview" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Source URL (optional)", name: "source", widget: "string", required: false }
          - *sectionsField

      - file: "content/pages/publications.json"
        label: "11 · Publications"
        name: "publications"
        fields:
          - { label: "Title & introduction", name: "intro", widget: "object", collapsed: false, fields: *introFields }
          - *heroImageField
          - *menuImageField
          - label: "Publications"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Kind", name: "kind", widget: "string", hint: "Groups the publication under a filter tab, e.g. Book or Brochure" }
              - { label: "Label (kind · languages)", name: "meta", widget: "string", hint: "e.g. Book · English, Hindi, Gujarati" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Download links"
                name: "editions"
                widget: "list"
                summary: "{{fields.label}}"
                hint: "One link per language edition — the card shows a button for each."
                fields:
                  - { label: "Language label", name: "label", widget: "string", hint: "e.g. English, हिन्दी, ગુજરાતી" }
                  - { label: "Link URL", name: "url", widget: "string", hint: "A Google Drive share link or any other public file URL." }
          - *sectionsField

      - file: "content/pages/tools.json"
        label: "12 · Tools"
        name: "tools"
        fields:
          - { label: "Title & introduction", name: "intro", widget: "object", collapsed: false, fields: *introFields }
          - *heroImageField
          - *menuImageField
          - label: "Tools"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Label (kind · what it does)", name: "meta", widget: "string", hint: "e.g. App · Record, map and compare" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Photo", name: "photo", widget: "object", collapsed: false, fields: *photoFields }
              - { label: "Button label", name: "linkLabel", widget: "string", hint: "e.g. Explore MyWell" }
              - label: "Button opens this page"
                name: "target"
                widget: "select"
                default: "mywell"
                hint: "Which section of this website the button opens. Ignored when an external link is set below."
                options:
                  - { label: "MyWell app", value: "mywell" }
                  - { label: "Groundwater game", value: "game" }
                  - { label: "The approach", value: "approach" }
                  - { label: "Bhujal Jankaars", value: "bjs" }
                  - { label: "Groundwater", value: "groundwater" }
                  - { label: "Films", value: "films" }
                  - { label: "Publications", value: "publications" }
              - { label: "External link (optional)", name: "url", widget: "string", required: false, hint: "Set this to send the button to another website instead of a page above." }
          - *sectionsField
