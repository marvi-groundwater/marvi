name: Build and deploy

# Renders index.html + content/*.json into _site (one page per language per
# section) and publishes that to GitHub Pages. Replaces the previous "serve
# the repo root as-is" Pages build, which could not produce per-page URLs.
#
# Note: this runs alongside auto-translate.yml. A content edit triggers both;
# the translation bot's own commit then triggers a second deploy carrying the
# new translations. That is intentional — the first deploy ships the English
# change immediately rather than waiting on the model.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest content should win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify built output
        run: node scripts/verify.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
