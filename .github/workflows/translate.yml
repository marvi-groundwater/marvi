name: Auto-translate content

# When the site's English content changes, translate any new/changed string
# into every language and commit the result. Only the delta is translated —
# existing translations are left untouched.
#
# Provider: the ANTHROPIC_API_KEY repo secret (Claude, claude-opus-5).
# Without the secret the run is a clean no-op — the site falls back to
# English for untranslated strings, nothing breaks.
#
# The translate commit itself triggers a second deploy carrying the new
# translations; that is intentional (the first deploy ships the English edit
# immediately rather than waiting on the model).

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'index.html'
      - 'src/templates.mjs'
      - '!content/i18n.json'   # this job's own output — never re-trigger on it
  workflow_dispatch: {}

permissions:
  contents: write   # to commit updated translations

concurrency:
  group: auto-translate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Translate new / changed strings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/auto-translate.mjs

      - name: Commit updated translations
        run: |
          if ! git diff --quiet -- content/i18n.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/i18n.json
            git commit -m "Update translations for changed content"
            git push
            echo "Pushed updated translations."
          else
            echo "No translation changes to commit."
          fi
