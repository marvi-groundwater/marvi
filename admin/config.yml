backend:
  name: github
  repo: marvi-groundwater/marvi
  branch: main
  base_url: https://sveltia-cms-auth.marvi-groundwater.workers.dev

local_backend: true

media_folder: "assets/marvi-originals"
public_folder: "/assets/marvi-originals"

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - file: "content/homepage.json"
        label: "Homepage Hero"
        name: "homepage"
        fields:
          - { label: "Hero Image", name: "heroImage", widget: "image", hint: "The large photo beside the headline. Click to choose from the library or upload a new one." }
          - label: "Hero Image — Focus"
            name: "heroImageFocus"
            widget: "select"
            default: "auto"
            hint: "Which part of the photo to keep when it is cropped to fit."
            options: &focusOptions
              - { label: "Auto (recommended)", value: "auto" }
              - { label: "Center", value: "center center" }
              - { label: "Top", value: "center top" }
              - { label: "Bottom", value: "center bottom" }
              - { label: "Left", value: "left center" }
              - { label: "Right", value: "right center" }
          - label: "Hero Image — Fit"
            name: "heroImageFit"
            widget: "select"
            default: "auto"
            hint: "Fill crops to the slot; Show whole never crops."
            options: &fitOptions
              - { label: "Auto (recommended)", value: "auto" }
              - { label: "Fill (crop to slot)", value: "cover" }
              - { label: "Show whole photo", value: "contain" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Hero Title", name: "heroTitle", widget: "text", hint: "Line break = where the headline wraps to a second line" }
          - { label: "Hero Body", name: "heroBody", widget: "text" }
          - { label: "Primary Button Label", name: "primaryButtonLabel", widget: "string" }
          - { label: "Secondary Button Label", name: "secondaryButtonLabel", widget: "string" }

  - name: "sections"
    label: "Section intros"
    files:
      - file: "content/sections.json"
        label: "All section intros"
        name: "sections"
        fields:
          - label: "The approach"
            name: "approach"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro line", name: "lede", widget: "text" }
          - label: "Bhujal Jankaars"
            name: "bjs"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro line", name: "lede", widget: "text" }
          - label: "Groundwater"
            name: "groundwater"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro line", name: "lede", widget: "text" }
          - label: "MyWell app"
            name: "mywell"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro line", name: "lede", widget: "text" }
          - label: "In the media"
            name: "media"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro line", name: "lede", widget: "text" }
          - label: "Films"
            name: "films"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro line", name: "lede", widget: "text" }
          - label: "Groundwater game"
            name: "game"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro line", name: "lede", widget: "text" }
          - label: "People & partners"
            name: "people"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro line", name: "lede", widget: "text" }
          - label: "Image archive"
            name: "archive"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Intro line", name: "lede", widget: "text" }

  - name: "media"
    label: "Media stories"
    files:
      - file: "content/media.json"
        label: "Media stories list"
        name: "media"
        fields:
          - label: "Stories"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Label (source · date)", name: "meta", widget: "string", hint: "e.g. ACIAR · 17 Sep 2024" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link URL", name: "url", widget: "string" }

  - name: "films"
    label: "Films"
    files:
      - file: "content/films.json"
        label: "Films list"
        name: "films"
        fields:
          - label: "Videos"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Label (category · source)", name: "meta", widget: "string", hint: "e.g. Documentary · Deutsche Welle" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "YouTube URL", name: "url", widget: "string", hint: "Paste the full YouTube link — the thumbnail is generated automatically" }

  - name: "partners"
    label: "People & partners"
    files:
      - file: "content/partners.json"
        label: "Partners list"
        name: "partners"
        fields:
          - label: "Partners"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Label (place · role)", name: "meta", widget: "string", hint: "e.g. Australia · Lead partner" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Link URL (optional)", name: "url", widget: "string", required: false }

  - name: "images"
    label: "Section images"
    files:
      - file: "content/images.json"
        label: "All section images"
        name: "images"
        fields:
          - label: "Home · Story card 1 (The method)"
            name: "homeStoryApproach"
            widget: "object"
            collapsed: true
            fields: &photoFields
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Focus", name: "focus", widget: "select", default: "auto", options: *focusOptions }
              - { label: "Fit", name: "fit", widget: "select", default: "auto", options: *fitOptions }
          - { label: "Home · Story card 2 (The people)", name: "homeStoryBjs", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "Home · Story card 3 (The platform)", name: "homeStoryMywell", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "Approach · Editorial photo 1", name: "approachEditorial1", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "Approach · Editorial photo 2", name: "approachEditorial2", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "Approach · Data panel photo", name: "approachDataPanel", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "Groundwater · Ribbon photo 1", name: "groundwaterRibbon1", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "Groundwater · Ribbon photo 2", name: "groundwaterRibbon2", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "Groundwater · Ribbon photo 3", name: "groundwaterRibbon3", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "MyWell · Main screenshot", name: "mywellMain", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "MyWell · Strip screenshot 1", name: "mywellStrip1", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "MyWell · Strip screenshot 2", name: "mywellStrip2", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "Game · Screenshot", name: "game", widget: "object", collapsed: true, fields: *photoFields }

  - name: "menu"
    label: "Menu photos"
    files:
      - file: "content/menu.json"
        label: "Menu card photos"
        name: "menu"
        fields:
          - { label: "01 · Overview", name: "home", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "02 · The approach", name: "approach", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "03 · Bhujal Jankaars", name: "bjs", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "04 · Groundwater", name: "groundwater", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "05 · MyWell app", name: "mywell", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "06 · In the media", name: "media", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "07 · Films", name: "films", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "08 · Groundwater game", name: "game", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "09 · People & partners", name: "people", widget: "object", collapsed: true, fields: *photoFields }
          - { label: "10 · Image archive", name: "archive", widget: "object", collapsed: true, fields: *photoFields }

  - name: "portraits"
    label: "People portraits"
    files:
      - file: "content/portraits.json"
        label: "Portrait band"
        name: "portraits"
        fields:
          - label: "Portraits"
            name: "items"
            widget: "list"
            fields: *photoFields

  - name: "gallery"
    label: "Image archive"
    files:
      - file: "content/gallery.json"
        label: "Archive gallery"
        name: "gallery"
        fields:
          - label: "Images"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Category", name: "category", widget: "string", hint: "Groups the image under a filter tab, e.g. Overview" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Source URL (optional)", name: "source", widget: "string", required: false }

  # ---------------------------------------------------------------------------
  # Pages & navigation.
  #
  # This is the site's page registry: it decides which pages exist, in what
  # order they appear in the menu, and what each one contains. Adding an entry
  # here creates a real page at its own URL, in every language.
  #
  # "Built-in section" entries are the original nine sections plus the
  # overview. Their layout is hand-built in the site's code, so only the menu
  # name and position can be changed here — the other templates are for new
  # pages. Deleting a built-in entry removes that section from the site.
  # ---------------------------------------------------------------------------
  - name: "pages"
    label: "Pages & navigation"
    files:
      - file: "content/pages.json"
        label: "Pages & menu order"
        name: "pages"
        fields:
          - label: "Pages"
            name: "pages"
            widget: "list"
            label_singular: "page"
            summary: "{{fields.name}}"
            typeKey: "template"
            hint: "Drag to reorder the menu. Choose a template when adding a page."
            types:
              - label: "Built-in section"
                name: "builtin"
                summary: "{{fields.name}} (built-in)"
                fields:
                  - { label: "Menu name", name: "name", widget: "string" }
                  - { label: "URL slug", name: "id", widget: "string", pattern: ['^[a-z0-9-]+$', "Lower-case letters, numbers and hyphens only"], hint: "Changing this changes the page address and breaks existing links." }
                  - { label: "Show in menu", name: "published", widget: "boolean", default: true, required: false }

              - label: "Editorial page — text-led, with photos"
                name: "editorial"
                summary: "{{fields.name}}"
                fields: &pageFields
                  - { label: "Menu name", name: "name", widget: "string", hint: "Short label shown in the left-hand menu." }
                  - { label: "URL slug", name: "id", widget: "string", pattern: ['^[a-z0-9-]+$', "Lower-case letters, numbers and hyphens only"], hint: "The page address, e.g. water-quality" }
                  - { label: "Show in menu", name: "published", widget: "boolean", default: true, required: false }
                  - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false, hint: "Small line above the headline." }
                  - { label: "Headline", name: "title", widget: "string" }
                  - { label: "Intro line", name: "lede", widget: "text", required: false, hint: "One or two sentences. Also used as the page's Google description." }
                  - { label: "Header photo", name: "cover", widget: "image", required: false, hint: "Large photo behind the headline. Also used when the page is shared." }
                  - label: "Header photo — Focus"
                    name: "coverFocus"
                    widget: "select"
                    default: "auto"
                    required: false
                    options: *focusOptions
                  - label: "Content blocks"
                    name: "blocks"
                    widget: "list"
                    label_singular: "block"
                    required: false
                    typeKey: "type"
                    hint: "Add sections in any order. Drag to rearrange."
                    types:
                      - label: "Text"
                        name: "prose"
                        summary: "Text"
                        fields:
                          - { label: "Text", name: "text", widget: "text", hint: "Leave a blank line between paragraphs." }
                          - { label: "Open with a large first paragraph", name: "lead", widget: "boolean", default: false, required: false }
                      - label: "Sub-heading"
                        name: "heading"
                        summary: "Heading — {{fields.text}}"
                        fields:
                          - { label: "Heading", name: "text", widget: "string" }
                      - label: "Photo"
                        name: "image"
                        summary: "Photo"
                        fields:
                          - { label: "Photo", name: "image", widget: "image" }
                          - { label: "Description for screen readers", name: "alt", widget: "string", required: false }
                          - { label: "Caption", name: "caption", widget: "string", required: false }
                          - { label: "Focus", name: "focus", widget: "select", default: "auto", required: false, options: *focusOptions }
                      - label: "Two photos side by side"
                        name: "imagePair"
                        summary: "Photo pair"
                        fields:
                          - { label: "Left photo", name: "imageA", widget: "image" }
                          - { label: "Left description", name: "altA", widget: "string", required: false }
                          - { label: "Right photo", name: "imageB", widget: "image" }
                          - { label: "Right description", name: "altB", widget: "string", required: false }
                      - label: "Pull quote"
                        name: "quote"
                        summary: "Quote"
                        fields:
                          - { label: "Quote", name: "text", widget: "text" }
                          - { label: "Attribution", name: "attribution", widget: "string", required: false }
                      - label: "Numbers"
                        name: "stats"
                        summary: "Numbers"
                        fields:
                          - label: "Figures"
                            name: "items"
                            widget: "list"
                            summary: "{{fields.value}} — {{fields.label}}"
                            fields:
                              - { label: "Number", name: "value", widget: "string" }
                              - { label: "Label", name: "label", widget: "string" }
                      - label: "Video"
                        name: "video"
                        summary: "Video — {{fields.title}}"
                        fields:
                          - { label: "Video URL", name: "url", widget: "string", hint: "A YouTube link; the thumbnail is picked up automatically." }
                          - { label: "Title", name: "title", widget: "string" }
                          - { label: "Small label", name: "meta", widget: "string", required: false }
                      - label: "Card grid"
                        name: "cards"
                        summary: "Cards"
                        fields:
                          - label: "Cards"
                            name: "items"
                            widget: "list"
                            summary: "{{fields.title}}"
                            fields:
                              - { label: "Title", name: "title", widget: "string" }
                              - { label: "Text", name: "text", widget: "text", required: false }
                              - { label: "Background photo", name: "image", widget: "image", required: false }
                      - label: "Numbered steps"
                        name: "steps"
                        summary: "Steps"
                        fields:
                          - label: "Steps"
                            name: "items"
                            widget: "list"
                            summary: "{{fields.title}}"
                            fields:
                              - { label: "Title", name: "title", widget: "string" }
                              - { label: "Text", name: "text", widget: "text", required: false }
                      - label: "Embedded page"
                        name: "embed"
                        summary: "Embed"
                        fields:
                          - { label: "URL to embed", name: "url", widget: "string" }
                          - { label: "Title", name: "title", widget: "string", required: false }

              - label: "Feature page — cards and steps"
                name: "feature"
                summary: "{{fields.name}}"
                fields: *pageFields

              - label: "Gallery page — photo-led"
                name: "gallery"
                summary: "{{fields.name}}"
                fields: *pageFields
